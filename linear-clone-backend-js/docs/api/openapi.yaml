openapi: 3.1.0
info:
  title: Linear Clone API
  description: >
    Backend API for a Linear-inspired project management application.

    This API provides authentication, user profiles, organizations, teams,

    issues, comments, labels, watchers, workflows, projects, cycles, and
    notifications.


    ## Authentication

    Most endpoints require a Bearer JWT access token in the `Authorization`
    header.

    Obtain tokens via `POST /api/v1/auth/login` or `POST /api/v1/auth/register`.

    The refresh token is stored in an HttpOnly cookie (`refreshToken`) scoped to
    `/api/v1/auth/refresh` with `SameSite=Strict`. The POST /api/v1/auth/refresh
    endpoint reads the cookie first, falling back to a request body field for
    backward compatibility. The cookie is set on login/refresh and cleared on
    logout.


    ## WebSocket Gateway

    Real-time events are available at `ws://<host>/ws` (path: `/ws`).

    ### Connection Lifecycle

    1. Connect to `ws://<host>/ws`
    2. Send an `authenticate` message with your JWT access token within 5 seconds
       (configurable via `WS_AUTH_TIMEOUT_MS`). Unauthenticated connections are
       closed.
    3. On successful authentication, you are automatically subscribed to channels
       for all teams you belong to (`team:<teamId>`).

    ### Channels

    Subscribe to channels to receive live updates:

    - `team:<teamId>` — all issues in a team (auto-subscribed on auth for your
      teams)
    - `issue:<issueId>` — updates for a specific issue
    - `user:<userId>` — events targeted at a specific user

    Channel access is validated: you must be a team member to subscribe to a
    `team:<id>` channel, and the issue must belong to a team you're a member of
    for `issue:<id>`.

    ### Rate Limiting

    Each connection is limited to **100 messages per minute**. Exceeding this
    limit results in a `rate_limited` error response and eventual disconnection.

    ### Message Format

    All messages are JSON. Server responses include a `type` field:

    - `authenticated` — successful authentication
    - `subscribed` — successfully subscribed to a channel
    - `unsubscribed` — successfully unsubscribed from a channel
    - `error` — error response with `code` and `message`

    ### Error Codes

    - `unauthorized` — missing or invalid authentication
    - `forbidden` — channel access denied
    - `invalid_message` — malformed message
    - `rate_limited` — rate limit exceeded
    - `channel_required` — subscribe/unsubscribe missing channel field
    - `already_subscribed` — duplicate subscription
    - `not_subscribed` — unsubscribe from non-subscribed channel
  version: 1.0.0
  contact:
    email: dev@example.com
  license:
    name: ISC
tags:
  - name: Health
  - name: Authentication
  - name: Sessions
  - name: Users
  - name: Organizations
  - name: Teams
  - name: Members
  - name: Issues
  - name: Comments
  - name: Labels
  - name: Watchers
  - name: Workflow
  - name: Projects
  - name: Cycles
  - name: Notifications
paths:
  /api/health:
    get:
      summary: Health check
      deprecated: false
      description: Returns the server health status. No authentication required.
      operationId: healthCheck
      tags:
        - Health
      parameters: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
              example:
                status: ok
      security: []
  /api/v1/auth/register:
    post:
      summary: Register a new user
      deprecated: false
      description: >-
        Creates a new user account and returns JWT tokens. The refresh token is
        set as an HttpOnly cookie (`refreshToken`) scoped to `/api/v1/auth/refresh`
        with `SameSite=Strict`. The refresh token is not returned in the response
        body.
      operationId: authRegister
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
                - password
              properties:
                email:
                  type: string
                  format: email
                  examples:
                    - user@example.com
                name:
                  type: string
                  minLength: 1
                  examples:
                    - John Doe
                password:
                  type: string
                  format: password
                  minLength: 8
                  examples:
                    - securePassword123
            example:
              email: jlagoria@example.com
              name: John Lagoria
              password: securePassword#123
        required: true
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResponse'
          headers:
            Set-Cookie:
              description: >-
                `refreshToken=<token>; HttpOnly; Secure; SameSite=Strict;
                Path=/api/v1/auth/refresh; Max-Age=604800`. The refresh token is
                not returned in the response body.
              schema:
                type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          headers: {}
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
          headers: {}
      security: []
  /api/v1/auth/login:
    post:
      summary: Authenticate user and get tokens
      deprecated: false
      description: >-
        Authenticates a user and returns JWT tokens. The refresh token is set as
        an HttpOnly cookie (`refreshToken`) scoped to `/api/v1/auth/refresh` with
        `SameSite=Strict`. Supports "Remember Me" for extended refresh token
        lifetime (30-day cookie Max-Age).
      operationId: authLogin
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  examples:
                    - user@example.com
                  description: User email
                password:
                  type: string
                  format: password
                  examples:
                    - securePassword123
                  description: User password
                rememberMe:
                  type: boolean
                  default: false
                  description: Extends refresh token to 30 days
            example:
              email: jlagoria@example.com
              password: securePassword#123
              rememberMe: true
        required: true
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/UserObject'
                      accessToken:
                        type: string
                    required:
                      - user
                      - accessToken
          headers:
            Set-Cookie:
              description: >-
                `refreshToken=<token>; HttpOnly; Secure; SameSite=Strict;
                Path=/api/v1/auth/refresh; Max-Age=604800` (or 2592000 with
                `rememberMe`). The refresh token is not returned in the response
                body.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Validation error
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
          headers: {}
      security: []
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token using a refresh token
      deprecated: false
      description: >-
        Exchanges a valid refresh token for a new access token. The refresh
        token is read from the `refreshToken` HttpOnly cookie (preferred) or
        from the request body (fallback for backward compatibility). The old
        refresh token is invalidated (single-use rotation) and a new one is set
        as a cookie.
      operationId: authRefreshToken
      tags:
        - Authentication
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: >-
                    Optional body fallback. Only used if the `refreshToken`
                    cookie is absent.
            example:
              refreshToken: '{{refreshToken}}'
        required: false
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                    required:
                      - accessToken
                required:
                  - data
              example:
                data:
                  accessToken: >-
                    eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxYjkxZGFkMC05ZDA0LTQyMjMtOGZlZi0yMGY0Y2ZhMDI1NzkiLCJ0eXBlIjoiYWNjZXNzIiwic2lkIjoiMDM5NmEzZWMtNWE4Yy00NzEwLTg5MGUtNDMxYjdkZTI4ZDY4IiwiaWF0IjoxNzg0MjQwNDg4LCJleHAiOjE3ODQyNDEzODgsImp0aSI6IjA5YTJmZTU5LTYxMGItNGI5Mi04Yzk4LWQzYzZlZjEwOWNhMSJ9.Db1HtgOB9NmaGqaJjrPJ5f3PyQTPJxdiV0mEni_oi4E
          headers:
            Set-Cookie:
              description: >-
                `refreshToken=<new-token>; HttpOnly; Secure; SameSite=Strict;
                Path=/api/v1/auth/refresh; Max-Age=604800`. The refresh token is
                rotated and set as a cookie; it is not returned in the response
                body.
              schema:
                type: string
        '401':
          description: Token expired or revoked
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenExpiredError'
                  - $ref: '#/components/schemas/TokenRevokedError'
          headers: {}
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: Validation failed
      security: []
  /api/v1/auth/logout:
    post:
      summary: Logout and revoke current session
      deprecated: false
      description: >-
        Terminates the user's session and invalidates all refresh tokens.
        Clears the `refreshToken` HttpOnly cookie. Requires a valid access
        token. Idempotent — calling multiple times returns success.
      operationId: authLogout
      tags:
        - Authentication
      parameters: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        enum:
                          - true
          headers:
            Set-Cookie:
              description: >-
                `refreshToken=; HttpOnly; Secure; SameSite=Strict;
                Path=/api/v1/auth/refresh; Max-Age=0`. The cookie is cleared on
                logout.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication required
      security:
        - BearerAuth: []
  /api/v1/auth/sessions:
    get:
      summary: List all active sessions for the current user
      deprecated: false
      description: ''
      operationId: listSessions
      tags:
        - Authentication
        - Sessions
      parameters: []
      responses:
        '200':
          description: List of active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            ipAddress:
                              type: string
                            userAgent:
                              type: string
                            rememberMe:
                              type: boolean
                            createdAt:
                              type: string
                            lastActivityAt:
                              type: string
                            isCurrent:
                              type: boolean
                    required:
                      - sessions
                required:
                  - data
              example:
                data:
                  sessions:
                    - id: 75d7053e-ce90-4b1a-9d4d-e24bb417d4b3
                      ipAddress: 127.0.0.1
                      userAgent: Apidog/1.0.0 (https://apidog.com)
                      rememberMe: true
                      createdAt: '2026-07-16T22:22:25.507Z'
                      lastActivityAt: '2026-07-16T22:22:25.507Z'
                      isCurrent: true
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication required
      security:
        - BearerAuth: []
  /api/v1/auth/sessions/revoke-all:
    post:
      summary: Revoke all sessions except the current one
      deprecated: false
      description: >-
        Revokes all sessions except the current one, effectively signing out
        from all other devices while remaining authenticated on the current
        device.
      operationId: revokeAllSessions
      tags:
        - Authentication
        - Sessions
      parameters: []
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        enum:
                          - true
                      revokedCount:
                        type: integer
                        minimum: 0
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication required
      security:
        - BearerAuth: []
  /api/v1/auth/sessions/{sessionId}:
    delete:
      summary: Revoke a specific session
      deprecated: false
      description: >-
        Revokes (terminates) a specific session by its identifier. Revoking the
        current session is equivalent to logging out.
      operationId: revokeSession
      tags:
        - Authentication
        - Sessions
      parameters:
        - name: sessionId
          in: path
          description: ''
          required: true
          example: 75d7053e-ce90-4b1a-9d4d-e24bb417d4b3
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        enum:
                          - true
          headers: {}
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Validation error
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication required
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          headers: {}
      security:
        - BearerAuth: []
  /api/v1/users/me:
    get:
      summary: Get current user profile
      deprecated: false
      description: Returns the authenticated user's profile information.
      operationId: getCurrentUser
      tags:
        - Users
      parameters: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/UserProfile'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication required
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
        - BearerAuth: []
    patch:
      summary: Update current user profile
      deprecated: false
      description: >
        Updates the authenticated user's profile information. Only provided
        fields are updated.
      operationId: updateCurrentUser
      tags:
        - Users
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: 1-255 characters
                avatarUrl:
                  type:
                    - string
                    - 'null'
                  format: uri
                  description: Valid URL format, or null to clear
            example:
              name: '{{$person.fullName}}'
              avatarUrl: '{{$image.avatar}}'
        required: true
      responses:
        '200':
          description: User profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/UserProfile'
          headers: {}
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Validation error
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication required
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
        - BearerAuth: []
  /api/v1/organizations:
    post:
      summary: Create a new organization
      deprecated: false
      description: >-
        Creates a new organization. The authenticated user becomes the
        organization owner.
      operationId: createOrganization
      tags:
        - Organizations
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: 1-255 characters, unique
            example:
              name: '{{$company.name}}'
        required: true
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      organization:
                        $ref: '#/components/schemas/Organization'
          headers: {}
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Validation error
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication required
        '409':
          $ref: '#/components/responses/Conflict'
          description: Resource conflict
      security:
        - BearerAuth: []
    get:
      summary: List organizations for the current user
      deprecated: false
      description: Returns all organizations the authenticated user belongs to.
      operationId: listOrganizations
      tags:
        - Organizations
      parameters: []
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      organizations:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            createdAt:
                              type: string
                            updatedAt:
                              type: string
                    required:
                      - organizations
                required:
                  - data
              example:
                data:
                  organizations:
                    - id: d48e1311-278d-4996-9fab-7f9435a1c9af
                      name: Kuphal, Gleason and Strosin
                      createdAt: '2026-07-16T22:35:22.132Z'
                      updatedAt: '2026-07-16T22:35:22.132Z'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication required
      security:
        - BearerAuth: []
  /api/v1/organizations/{organizationId}:
    get:
      summary: Get organization details
      deprecated: false
      description: >
        Returns details for a specific organization. User must be a member of
        the organization.
      operationId: getOrganization
      tags:
        - Organizations
      parameters:
        - name: organizationId
          in: path
          description: Organization identifie
          required: true
          example: ''
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      organization:
                        $ref: '#/components/schemas/Organization'
          headers: {}
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Validation error
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication required
        '403':
          description: Not a member of this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          headers: {}
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
        - BearerAuth: []
    delete:
      summary: Delete an organization (owner only)
      deprecated: false
      description: >-
        Soft-deletes an organization and all its members. Only the organization
        owner can delete an organization.
      operationId: deleteOrganization
      tags:
        - Organizations
      parameters:
        - name: organizationId
          in: path
          description: Organization identifier
          required: true
          example: ''
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Organization deleted
          headers: {}
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Validation error
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication required
        '403':
          description: Only owner can delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          headers: {}
        '404':
          $ref: '#/components/responses/NotFound'
          description: Resource not found
      security:
        - BearerAuth: []
  /api/v1/organizations/{organizationId}/teams:
    post:
      summary: Create a team within an organization
      deprecated: false
      description: >-
        Creates a new team within an organization. The authenticated user must
        be an organization member and becomes the team admin. The team key must
        be unique within the organization.
      operationId: createTeam
      tags:
        - Teams
      parameters:
        - name: organizationId
          in: path
          description: Organization identifier
          required: true
          example: ''
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - key
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: 1-255 characters
                key:
                  type: string
                  minLength: 1
                  maxLength: 10
                  description: ' 1-10 uppercase letters, unique within org. The `key` is automatically uppercased. Lowercase or special characters are rejected'
                  pattern: ^[A-Z]+$
            example:
              name: '{{$finance.accountName}}'
              key: '{{$string.fromCharacters(min=3)|upper}}'
        required: true
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      team:
                        $ref: '#/components/schemas/Team'
          headers: {}
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Validation error
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication required
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Forbidden
        '409':
          description: Team key already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
          headers: {}
      security:
        - BearerAuth: []
    get:
      summary: List teams in an organization
      deprecated: false
      description: >-
        Returns all active (non-deleted) teams within an organization. The
        authenticated user must be an organization member.
      operationId: listTeams
      tags:
        - Teams
      parameters:
        - name: organizationId
          in: path
          description: Organization identifier
          required: true
          example: ''
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      teams:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            key:
                              type: string
                            memberCount:
                              type: integer
                            createdAt:
                              type: string
                            updatedAt:
                              type: string
                    required:
                      - teams
                required:
                  - data
              example:
                data:
                  teams:
                    - id: 047d1d73-0b6f-4386-9acb-061b9cecea50
                      name: Home Loan Account
                      key: ZNG
                      memberCount: 0
                      createdAt: '2026-07-16T23:19:26.005Z'
                      updatedAt: '2026-07-16T23:19:26.005Z'
          headers: {}
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Validation error
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication required
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Forbidden
      security:
        - BearerAuth: []
  /api/v1/teams/{teamId}:
    get:
      summary: Get team details
      deprecated: false
      description: >-
        Returns details for a specific team. The authenticated user must be a
        team member.
      operationId: getTeam
      tags:
        - Teams
      parameters:
        - name: teamId
          in: path
          description: Team identifier
          required: true
          example: ''
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Team details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      team:
                        $ref: '#/components/schemas/Team'
          headers: {}
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Validation error
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication required
        '403':
