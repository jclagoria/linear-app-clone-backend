                        type: object
                        properties:
                          issue_assigned:
                            type: boolean
                          issue_commented:
                            type: boolean
                          issue_status_changed:
                            type: boolean
                        required:
                          - issue_assigned
                          - issue_commented
                          - issue_status_changed
                    required:
                      - inApp
                      - email
                      - types
                required:
                  - data
              example:
                data:
                  inApp: true
                  email: true
                  types:
                    issue_assigned: true
                    issue_commented: true
                    issue_status_changed: false
          headers: {}
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Validation error
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Authentication required
      security:
        - BearerAuth: []
